name: branch-policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linear-history:
    name: PR must be linear (no merge commits)
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on merge commits in PR range
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          echo "Base: $BASE"
          echo "Head: $HEAD"
          MERGES=$(git rev-list --merges --count "$BASE..$HEAD")
          echo "Merge commits in range: $MERGES"
          if [ "$MERGES" -ne 0 ]; then
            echo "::error::PR branch contains $MERGES merge commit(s). Rebase onto main instead: git fetch origin && git rebase origin/main"
            git rev-list --merges --oneline "$BASE..$HEAD"
            exit 1
          fi
          echo "OK: no merge commits in PR range."
